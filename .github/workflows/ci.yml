name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check available scripts
        id: scripts
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = pkg.scripts || {};
          const checks = {
            lint: 'lint',
            typecheck: 'typecheck',
            test: 'test',
            test_coverage: 'test:coverage',
            build: 'build',
          };
          for (const [output, script] of Object.entries(checks)) {
            console.log(`${output}=${Object.prototype.hasOwnProperty.call(scripts, script)}`);
          }
          NODE

      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.scripts.outputs.typecheck == 'true'
        run: npm run typecheck

      - name: Test coverage
        if: steps.scripts.outputs.test_coverage == 'true'
        run: npm run test:coverage

      - name: Build
        if: steps.scripts.outputs.build == 'true'
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
