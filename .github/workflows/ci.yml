name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check available scripts
        id: scripts
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const scripts = pkg.scripts || {};
          for (const name of ['lint', 'typecheck', 'test', 'build']) {
            console.log(`${name}=${Object.prototype.hasOwnProperty.call(scripts, name)}`);
          }
          NODE

      - name: Lint
        if: steps.scripts.outputs.lint == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.scripts.outputs.typecheck == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.scripts.outputs.test == 'true'
        run: npm run test

      - name: Build
        if: steps.scripts.outputs.build == 'true'
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
